<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Picture Album</title>
    <meta name="description"
        content="A picture album of temples around the world that has their name, age, location, and size. Filters by old, new, large, and small.">
    <meta name="author" content="Enoch Sagoe">
    <link rel="stylesheet" href="styles/filtered-temples.css">
    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>
    <header>
        <h1>Temple Album</h1>
        <nav aria-label="Main">
            <ul>
                <li><a href="#" data-filter="home" aria-current="page">Home</a></li>
                <li><a href="#" data-filter="old">Old</a></li>
                <li><a href="#" data-filter="new">New</a></li>
                <li><a href="#" data-filter="large">Large</a></li>
                <li><a href="#" data-filter="small">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 id="filter-title">All Temples</h2>
        <div id="temple-cards" class="gallery"></div>
    </main>

    <footer>
        <p>© <span id="currentyear"></span> Enoch Sagoe</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
